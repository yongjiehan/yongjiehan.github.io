title: "Yongjie Han"
description: "Yongjie Han — economics student at Peking University."
url: "https://yongjiehan.github.io"
baseurl: ""
lang: "en"
timezone: "Asia/Taipei"

author:
  name: "Yongjie Han"
  email: "hanyongjie@stu.pku.edu.cn"
  github: "yongjiehan"

include:
  - _pages

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - vendor

markdown: kramdown
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
